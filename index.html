html<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷便利商店 | 您的24小時好鄰居</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- 導覽列 -->
    <header class="navbar">
        <div class="logo">🏪 快捷便利商店</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#" class="active">首頁</a></li>
                <li><a href="#">當期優惠</a></li>
                <li><a href="#">美味鮮食</a></li>
                <li><a href="#">門市查詢</a></li>
                <li><a href="#">聯絡我們</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主視覺橫幅 -->
    <section class="hero">
        <div class="hero-content">
            <h1>美味新上市！溫暖您的每一天</h1>
            <p>全新現煮咖啡與現烤烘焙，24小時隨時為您應援。</p>
            <a href="#" class="btn">查看最新優惠</a>
        </div>
    </section>

    <!-- 商品分類 -->
    <section class="categories">
        <h2 class="section-title">嚴選分類</h2>
        <div class="category-grid">
            <div class="category-card">
                <div class="icon">☕</div>
                <h3>現煮咖啡</h3>
            </div>
            <div class="category-card">
                <div class="icon">🍱</div>
                <h3>美味鮮食</h3>
            </div>
            <div class="category-card">
                <div class="icon">🍦</div>
                <h3>人氣甜點</h3>
            </div>
            <div class="category-card">
                <div class="icon">零食</div>
                <h3>休閒零嘴</h3>
            </div>
        </div>
    </section>

    <!-- 本期特惠 -->
    <section class="promotions">
        <h2 class="section-title">本期主打優惠</h2>
        <div class="promo-grid">
            <div class="promo-card">
                <span class="badge">買一送一</span>
                <div class="promo-info">
                    <h3>活力美式咖啡</h3>
                    <p>限時優惠，開啟充滿活力的一天。</p>
                </div>
            </div>
            <div class="promo-card">
                <span class="badge">第二件6折</span>
                <div class="promo-info">
                    <h3>日式精緻便當</h3>
                    <p>嚴選在地食材，天天吃都不會膩。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer">
        <p>&copy; 2026 快捷便利商店 版權所有。 24小時竭誠為您服務。</p>
    </footer>

</body>
</html>
